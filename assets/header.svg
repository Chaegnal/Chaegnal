<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Eva Legrand, software engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1419"/>
      <stop offset="1" stop-color="#1b2433"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb4a2"/>
      <stop offset="1" stop-color="#ffd6a5"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <style>
      .name{font:700 62px Georgia,'Times New Roman',serif;letter-spacing:-1px}
      .role{font:400 21px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#c9d1d9;letter-spacing:.3px}
      .meta{font:400 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b98a9;letter-spacing:1px}
      .float{animation:f 7s ease-in-out infinite}
      .float2{animation:f 9s ease-in-out infinite reverse}
      @keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      .rise{animation:r .9s ease-out backwards}
      .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}
      @keyframes r{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      .blink{animation:b 1.1s steps(1) infinite}
      @keyframes b{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1000" height="260" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="16" fill="url(#dots)"/>
  <g class="float"><circle cx="860" cy="70" r="74" fill="none" stroke="#ffb4a2" stroke-opacity=".35" stroke-width="1.5"/><circle cx="860" cy="70" r="46" fill="#ffb4a2" fill-opacity=".10"/></g>
  <g class="float2"><circle cx="905" cy="190" r="30" fill="none" stroke="#9ec1ff" stroke-opacity=".4" stroke-width="1.5"/><circle cx="760" cy="205" r="9" fill="#ffd6a5" fill-opacity=".7"/></g>
  <text x="60" y="84" class="meta rise d1">SOFTWARE ENGINEER · EPITECH PARIS · 2027</text>
  <text x="60" y="155" class="name rise d2" fill="url(#ink)">Eva Legrand</text>
  <text x="60" y="200" class="role rise d3">I build things that run on servers, in game loops, and in browsers.</text>
  <rect x="60" y="218" width="10" height="3" fill="#ffb4a2" class="blink"/>
</svg>
