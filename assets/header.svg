<style>.n{font:700 60px "Segoe UI",Helvetica,Arial,sans-serif;fill:#fff;letter-spacing:-1.5px}.s{font:400 20px "Segoe UI",Helvetica,Arial,sans-serif}.t{font:600 15px "Segoe UI",Helvetica,Arial,sans-serif;fill:#fff}.u{font:400 12.5px "Segoe UI",Helvetica,Arial,sans-serif;fill:#fff;fill-opacity:.6}.c{fill:#fff;fill-opacity:.08;stroke:#fff;stroke-opacity:.2}.m{font:500 13px ui-monospace,Menlo,Consolas,monospace}.a{animation:f 6s ease-in-out infinite}.b{animation:f 7s ease-in-out infinite reverse}.d{animation:f 8s ease-in-out infinite}@keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}} .s{fill:#9ee7d7}.k{fill:#ff9e7a}.f{fill:#7dd3fc}.g2{fill:#c4b5fd}.p{fill:#fff;fill-opacity:.7}</style>
