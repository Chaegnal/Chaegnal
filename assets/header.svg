<g class="d"><rect x="580" y="124" width="200" height="74" rx="12" class="c"/><text x="598" y="150" class="m"><tspan class="k">export</tspan> <tspan class="g2">const</tspan> <tspan class="f">route</tspan> <tspan class="p">=</tspan></text><text x="616" y="170" class="m p">router.use(gw);</text></g>
<g class="a"><rect x="790" y="160" width="170" height="56" rx="12" class="c"/><text x="808" y="184" class="m"><tspan class="k">$</tspan> <tspan class="p">make &amp;&amp; ./run</tspan></text><text x="808" y="204" class="m" fill="#86efac">build ok</text></g>
